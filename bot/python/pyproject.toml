[project]
name = "btclat"
version = "0.1.0"
description = "Polymarket BTC up/down latency strategy: research and build"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.11"]

[tool.setuptools.packages.find]
include = ["btclat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
